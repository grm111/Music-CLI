[package]
name = "music_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = {version = "4.6.7", features = ["derive", "cargo"] }
crossterm = "0.29.0"
dirs = "7.0.0"
freeverb = "0.2.0"
global-hotkey = "0.8.0"
interprocess = "2.4.4"
nucleo-matcher = "0.3.1"
reqwest = { version = "0.13.5", features = ["blocking"] }
rodio = { version = "0.22.2", features = ["playback"] }
rubberband = "0.1.5"
sysinfo = "0.40.1"
walkdir = "2.5.0"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging"] }
